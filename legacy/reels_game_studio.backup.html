<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reels & TikTok Viral Game Studio (9:16)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #07070b;
            color: #f3f4f6;
            overflow-x: hidden;
        }
        /* 9:16 Reels proporsiyasini saqlovchi konteyner */
        .reels-wrapper {
            aspect-ratio: 9 / 16;
            width: 100%;
            max-width: 390px;
            background: #020204;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.9), 0 0 20px rgba(59, 130, 246, 0.15);
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 1rem;
        }
        @keyframes pulse-rec {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.45; transform: scale(1.08); }
        }
        .rec-dot {
            animation: pulse-rec 1.1s infinite ease-in-out;
        }
        /* Maxsus skrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col lg:flex-row items-center lg:items-start justify-center gap-5 p-3 sm:p-5">

    <!-- CHAP / YUQORI QISM: 9:16 REELS SAHNASI VA ASOSIY TUGMALAR -->
    <div class="flex flex-col items-center w-full max-w-[390px] shrink-0">
        <!-- Holat va Taymer paneli -->
        <div class="w-full flex items-center justify-between mb-2 px-2">
            <div class="flex items-center gap-2">
                <span class="text-xs font-extrabold uppercase tracking-wider px-2.5 py-1 rounded-full bg-gradient-to-r from-pink-600 to-purple-600 text-white shadow">
                    9:16 REELS / SHORTS
                </span>
                <span id="recBadge" class="hidden items-center gap-1.5 text-xs font-bold px-2.5 py-1 rounded-full bg-red-950/90 border border-red-500/60 text-red-300">
                    <span class="w-2.5 h-2.5 rounded-full bg-red-500 rec-dot"></span>
                    REC <span id="recTimer">00:00</span>
                </span>
            </div>
            <button id="btnMute" type="button" class="text-xs font-semibold px-3 py-1 rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-700 transition">
                🔊 Ovoz: Yoqilgan
            </button>
        </div>

        <!-- 9:16 O'yin Canvas Sahnasi (Faqat shu joy videoga yoziladi!) -->
        <div class="reels-wrapper relative rounded-2xl border border-gray-800 overflow-hidden">
            <canvas id="gameCanvas" width="720" height="1280"></canvas>
        </div>

        <!-- Boshqaruv va Yozib olish tugmalari -->
        <div class="w-full grid grid-cols-1 gap-2.5 mt-3">
            <button id="btnStartRecord" type="button" class="w-full py-3.5 px-4 rounded-xl font-black text-sm sm:text-base uppercase tracking-wide bg-gradient-to-r from-red-600 via-rose-600 to-pink-600 hover:from-red-500 hover:to-pink-500 text-white shadow-lg shadow-red-900/40 flex items-center justify-center gap-2 transition active:scale-[0.99]">
                <span class="w-3 h-3 rounded-full bg-white"></span>
                <span>Boshlash va Videoga Yozish</span>
            </button>

            <div class="grid grid-cols-2 gap-2">
                <button id="btnStartOnly" type="button" class="py-2.5 px-3 rounded-xl font-bold text-xs sm:text-sm bg-emerald-600 hover:bg-emerald-500 text-white shadow transition">
                    ▶ Yozmasdan O'ynatish
                </button>
                <button id="btnStopReset" type="button" class="py-2.5 px-3 rounded-xl font-bold text-xs sm:text-sm bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-700 transition">
                    🔄 Qayta Tiklash
                </button>
            </div>
        </div>

        <!-- Tayyor videoni yuklab olish bloki -->
        <div id="downloadPanel" class="hidden w-full mt-3 p-3.5 rounded-2xl bg-emerald-950/50 border border-emerald-500/50 flex-col gap-2">
            <div class="flex items-center justify-between">
                <span class="text-xs font-bold text-emerald-300">✅ Video tayyor! (9:16 HD)</span>
                <span id="videoFormatLabel" class="text-[11px] text-emerald-400 font-mono"></span>
            </div>
            <a id="downloadLink" href="#" download="reels_game.webm" class="w-full py-2.5 px-4 rounded-xl font-extrabold text-center text-sm bg-emerald-500 hover:bg-emerald-400 text-gray-950 shadow transition">
                📥 Videoni Yuklab Olish
            </a>
        </div>
    </div>

    <!-- O'NG / PASTKI QISM: SOZLAMALAR VA 6 XIL O'YIN KONSTRUKTORI (Videoga tushmaydi) -->
    <div class="w-full max-w-2xl bg-gray-900/90 border border-gray-800 rounded-2xl p-4 sm:p-6 shadow-2xl flex flex-col gap-4">
        <div class="border-b border-gray-800 pb-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
            <div>
                <h1 class="text-lg sm:text-xl font-black text-white tracking-tight">🎬 Reels & TikTok O'yin Studiyasi</h1>
                <p class="text-xs text-gray-400">Bu panel videoga tushmaydi — faqat 9:16 o'yin sahnasi va ASMR zarba ovozlari yozib olinadi.</p>
            </div>
            <span class="text-[11px] font-bold px-2.5 py-1 rounded-lg bg-blue-950 text-blue-300 border border-blue-800/60 self-start sm:self-auto">
                720x1280 • 60 FPS
            </span>
        </div>

        <!-- 1. O'yin rejimi va Tepada chiqadigan savol -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase mb-1">O'yin Turi (6 xil Viral Rejim)</label>
                <select id="selGameMode" class="w-full bg-gray-950 border border-gray-700 rounded-xl px-3 py-2.5 text-sm font-semibold text-white focus:outline-none focus:border-blue-500">
                    <option value="floors">1. Qavatlarni Sindirish (Floor Breaker)</option>
                    <option value="turf">2. Hudud Bosib Olish (Turf War 50% vs 50%)</option>
                    <option value="rps">3. Tosh - Qaychi - Qog'oz (RPS Battle Royale)</option>
                    <option value="boss">4. Gigant Bossni Yiqitish (Boss Raid VS)</option>
                    <option value="plinko">5. Plinko Ko'paytirish Poygasi (Multiplier Gates)</option>
                    <option value="rings">6. Aylana Qafasdan Qochish (Ring Escape)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Tepadagi yozuv (Bo'sh qolsa ko'rinmaydi)</label>
                <input type="text" id="inpHookText" value="" placeholder="Masalan: Qaysi biri yutadi? 👇" class="w-full bg-gray-950 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
            </div>
        </div>

        <!-- Tayyor Ssenariylar (Presets) -->
        <div>
            <label class="block text-xs font-bold text-gray-400 uppercase mb-1.5">Tezkor Viral O'yinlar (Bir bosishda tanlash)</label>
            <div class="flex flex-wrap gap-2">
                <button type="button" onclick="applyPreset('screenshot')" class="text-xs bg-red-950/70 hover:bg-red-900/80 text-red-200 border border-red-700/50 px-3 py-2 rounded-lg font-semibold transition">
                    📸 1. Qavatlar (X100 vs +300)
                </button>
                <button type="button" onclick="applyPreset('turfWar')" class="text-xs bg-emerald-950/70 hover:bg-emerald-900/80 text-emerald-200 border border-emerald-700/50 px-3 py-2 rounded-lg font-semibold transition">
                    ⚔️ 2. Hudud Jangi (Turf War)
                </button>
                <button type="button" onclick="applyPreset('rpsRoyale')" class="text-xs bg-amber-950/70 hover:bg-amber-900/80 text-amber-200 border border-amber-700/50 px-3 py-2 rounded-lg font-semibold transition">
                    🪨✂️📄 3. Tosh-Qaychi-Qog'oz
                </button>
                <button type="button" onclick="applyPreset('bossRaid')" class="text-xs bg-purple-950/70 hover:bg-purple-900/80 text-purple-200 border border-purple-700/50 px-3 py-2 rounded-lg font-semibold transition">
                    👾 4. Gigant Bossga Hujum
                </button>
                <button type="button" onclick="applyPreset('plinkoRace')" class="text-xs bg-cyan-950/70 hover:bg-cyan-900/80 text-cyan-200 border border-cyan-700/50 px-3 py-2 rounded-lg font-semibold transition">
                    🎰 5. Plinko Darvozalar (10.000 gacha)
                </button>
                <button type="button" onclick="applyPreset('ringEscape')" class="text-xs bg-blue-950/70 hover:bg-blue-900/80 text-blue-200 border border-blue-700/50 px-3 py-2 rounded-lg font-semibold transition">
                    ⭕ 6. Aylana Qafasdan Qochish
                </button>
            </div>
        </div>

        <!-- 2. QIZIL VA KO'K TOMON SOZLAMALARI -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
            <!-- Chap tomon: QIZIL -->
            <div class="p-3.5 rounded-xl bg-red-950/20 border border-red-500/40 flex flex-col gap-2.5">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-black uppercase tracking-wider text-red-400">🔴 Chap Tomon (Qizil)</span>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[11px] text-gray-400 font-semibold">Tepa Yozuv (Badge)</label>
                        <input type="text" id="redBadge" value="X100" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-2.5 py-1.5 text-sm font-bold text-red-400">
                    </div>
                    <div>
                        <label class="text-[11px] text-gray-400 font-semibold">Boshlang'ich To'plar</label>
                        <input type="number" id="redCount" value="1" min="1" max="5000" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-2.5 py-1.5 text-sm font-bold text-white">
                    </div>
                    <div>
                        <label class="text-[11px] text-gray-400 font-semibold">Zarba Kuchi (Damage)</label>
                        <input type="number" id="redPower" value="25" min="1" max="1000" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-2.5 py-1.5 text-sm font-bold text-white">
                    </div>
                    <div>
                        <label class="text-[11px] text-gray-400 font-semibold">To'p O'lchami (px)</label>
                        <input type="number" id="redRadius" value="11" min="4" max="26" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-2.5 py-1.5 text-sm font-bold text-white">
                    </div>
                </div>
                <div>
                    <label class="text-[11px] text-gray-400 font-semibold">Qavat singanda / Bonus qoidasi</label>
                    <select id="redFloorRule" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-2.5 py-1.5 text-xs font-semibold text-gray-200 mt-0.5">
                        <option value="double" selected>To'plar soni 2 baravar ko'payadi (x2)</option>
                        <option value="plus50">+50 ta to'p qo'shiladi</option>
                        <option value="plus300">+300 ta to'p qo'shiladi</option>
                        <option value="power2x">To'p zarba kuchi 2x oshadi</option>
                        <option value="none">O'zgarmaydi (Faqat boshlang'ich to'plar)</option>
                    </select>
                </div>
            </div>

            <!-- O'ng tomon: KO'K -->
            <div class="p-3.5 rounded-xl bg-blue-950/20 border border-blue-500/40 flex flex-col gap-2.5">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-black uppercase tracking-wider text-blue-400">🔵 O'ng Tomon (Ko'k)</span>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[11px] text-gray-400 font-semibold">Tepa Yozuv (Badge)</label>
                        <input type="text" id="blueBadge" value="+300" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-2.5 py-1.5 text-sm font-bold text-blue-400">
                    </div>
                    <div>
                        <label class="text-[11px] text-gray-400 font-semibold">Boshlang'ich To'plar</label>
                        <input type="number" id="blueCount" value="1500" min="1" max="5000" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-2.5 py-1.5 text-sm font-bold text-white">
                    </div>
                    <div>
                        <label class="text-[11px] text-gray-400 font-semibold">Zarba Kuchi (Damage)</label>
                        <input type="number" id="bluePower" value="1" min="1" max="1000" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-2.5 py-1.5 text-sm font-bold text-white">
                    </div>
                    <div>
                        <label class="text-[11px] text-gray-400 font-semibold">To'p O'lchami (px)</label>
                        <input type="number" id="blueRadius" value="5" min="4" max="26" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-2.5 py-1.5 text-sm font-bold text-white">
                    </div>
                </div>
                <div>
                    <label class="text-[11px] text-gray-400 font-semibold">Qavat singanda / Bonus qoidasi</label>
                    <select id="blueFloorRule" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-2.5 py-1.5 text-xs font-semibold text-gray-200 mt-0.5">
                        <option value="none">O'zgarmaydi (Faqat boshlang'ich to'plar)</option>
                        <option value="plus300" selected>+300 ta to'p qo'shiladi</option>
                        <option value="plus50">+50 ta to'p qo'shiladi</option>
                        <option value="double">To'plar soni 2 baravar ko'payadi (x2)</option>
                        <option value="power2x">To'p zarba kuchi 2x oshadi</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 3. QAVATLAR (FLOORS) VA FIZIKA TEZLIGI -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase mb-1">10 ta Qavat Joni (Floor HP ro'yxati)</label>
                <input type="text" id="inpFloorsHP" value="100, 500, 1000, 1500, 2000, 3000, 4000, 5000, 6000, 7000" class="w-full bg-gray-950 border border-gray-700 rounded-xl px-3 py-2 text-xs font-mono text-gray-200">
            </div>
            <div class="flex flex-col justify-between">
                <div class="flex items-center justify-between">
                    <label class="text-xs font-bold text-gray-400 uppercase">Simulyatsiya Tezligi</label>
                    <span id="lblSpeed" class="text-xs font-extrabold text-blue-400">1.2x</span>
                </div>
                <input type="range" id="rngSpeed" min="0.6" max="2.5" step="0.1" value="1.2" class="w-full accent-blue-500 cursor-pointer my-1">
                <label class="flex items-center gap-2 text-xs text-gray-300 cursor-pointer select-none">
                    <input type="checkbox" id="chkAutoStop" checked class="accent-emerald-500 w-4 h-4 rounded">
                    <span>G'olib chiqqanda videoni avtomatik tugatish (2 soniyadan so'ng)</span>
                </label>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. AUDIO SINTEZATOR VA MEDIA RECORDER
        // ==========================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const W = canvas.width;   // 720
        const H = canvas.height;  // 1280

        let audioCtx = null;
        let audioDest = null;
        let soundEnabled = true;
        let lastSoundTime = 0;

        function ensureAudio() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContextClass();
                audioDest = audioCtx.createMediaStreamDestination();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // ASMR zarba va g'alaba ovozlari (videoga ham yoziladi)
        function playSound(type, sideKey) {
            if (!soundEnabled || !audioCtx) return;
            const now = performance.now();
            if (type === 'hit' && now - lastSoundTime < 26) return;
            lastSoundTime = now;

            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const t = audioCtx.currentTime;

                if (type === 'hit') {
                    osc.type = 'sine';
                    const baseFreq = sideKey === 'red' ? 280 : 390;
                    osc.frequency.setValueAtTime(baseFreq + Math.random() * 110, t);
                    osc.frequency.exponentialRampToValueAtTime(110, t + 0.045);
                    gain.gain.setValueAtTime(0.06, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.045);
                    osc.start(t);
                    osc.stop(t + 0.05);
                } else if (type === 'break') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(520, t);
                    osc.frequency.exponentialRampToValueAtTime(140, t + 0.18);
                    gain.gain.setValueAtTime(0.22, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
                    osc.start(t);
                    osc.stop(t + 0.19);
                } else if (type === 'win') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, t);
                    osc.frequency.setValueAtTime(554.37, t + 0.12);
                    osc.frequency.setValueAtTime(659.25, t + 0.24);
                    osc.frequency.setValueAtTime(880, t + 0.36);
                    gain.gain.setValueAtTime(0.25, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.75);
                    osc.start(t);
                    osc.stop(t + 0.76);
                }

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                if (audioDest) gain.connect(audioDest);
            } catch (e) {
                // Audio xatoliklarini o'tkazib yuborish
            }
        }

        // ==========================================
        // 2. O'YIN HOLATI VA GEOMETRIYASI
        // ==========================================
        let gameRunning = false;
        let isRecording = false;
        let mediaRecorder = null;
        let recordedChunks = [];
        let recStartTime = 0;
        let recTimerInterval = null;
        let autoStopTimeout = null;
        let winnerSide = null;
        let winFlashAlpha = 0;
        let particles = [];

        // Ustunlar o'lchami (rasmdagidek 9:16 formatda)
        const BOX_TOP = 248;
        const BOX_BOTTOM = 1236;
        const BOX_HEIGHT = BOX_BOTTOM - BOX_TOP;
        const LEFT_BOX = { x: 18, y: BOX_TOP, w: 334, h: BOX_HEIGHT };
        const RIGHT_BOX = { x: 368, y: BOX_TOP, w: 334, h: BOX_HEIGHT };
        const FULL_BOX = { x: 24, y: BOX_TOP, w: 672, h: BOX_HEIGHT };

        let state = {
            mode: 'floors',
            speed: 1.2,
            hookText: '',
            red: null,
            blue: null,
            turf: null,
            rps: null,
            boss: null,
            plinko: null
        };

        // Raqamlarni rasmdagi kabi nuqta bilan formatlash (masalan: 1500 -> 1.500)
        function formatNumberDot(num) {
            const n = Math.max(0, Math.round(num));
            return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        }

        function createSideConfig(sideKey, box) {
            const isRed = sideKey === 'red';
            const badge = document.getElementById(isRed ? 'redBadge' : 'blueBadge').value.trim();
            const logicalBalls = Math.max(1, parseInt(document.getElementById(isRed ? 'redCount' : 'blueCount').value) || 1);
            const power = Math.max(1, parseFloat(document.getElementById(isRed ? 'redPower' : 'bluePower').value) || 1);
            const radius = Math.min(26, Math.max(4, parseFloat(document.getElementById(isRed ? 'redRadius' : 'blueRadius').value) || 7));
            const floorRule = document.getElementById(isRed ? 'redFloorRule' : 'blueFloorRule').value;

            // Qavatlar ro'yxati
            const rawFloors = document.getElementById('inpFloorsHP').value.split(',');
            const hpList = rawFloors.map(s => parseInt(s.trim())).filter(n => !isNaN(n) && n > 0);
            if (hpList.length === 0) hpList.push(100, 500, 1000, 2000, 5000);

            const totalFloors = hpList.length;
            const floorGap = box.h / (totalFloors + 1);
            const floors = hpList.map((hp, idx) => ({
                index: idx,
                y: box.y + floorGap * (idx + 1),
                hp: hp,
                maxHp: hp,
                broken: false,
                hitFlash: 0
            }));

            // Aylana qafaslar (Rings mode uchun)
            const ringCount = Math.min(8, totalFloors);
            const rings = [];
            for (let i = 0; i < ringCount; i++) {
                rings.push({
                    index: i,
                    radius: 36 + i * 17,
                    angle: (i * 0.7),
                    rotSpeed: (i % 2 === 0 ? 1 : -1) * (0.022 + i * 0.003),
                    gapSize: 0.68,
                    broken: false,
                    color: isRed ? `hsl(${0 + i * 5}, 90%, ${55 - i * 2}%)` : `hsl(${215 + i * 5}, 95%, ${60 - i * 2}%)`
                });
            }

            const sideObj = {
                key: sideKey,
                isRed: isRed,
                box: box,
                badge: badge,
                logicalBalls: logicalBalls,
                power: power,
                radius: radius,
                floorRule: floorRule,
                floors: floors,
                currentFloorIdx: 0,
                rings: rings,
                balls: [],
                mainColor: isRed ? '#ff1e1e' : '#2563eb',
                glowColor: isRed ? '#ff3b3b' : '#3b82f6',
                barFill: isRed ? '#e11d48' : '#1d4ed8',
                activeBarFill: isRed ? '#ff2a2a' : '#93c5fd'
            };

            syncSimulatedBalls(sideObj, true);
            return sideObj;
        }

        // Fizik to'plar sonini boshqarish (60 FPS ravon ishlashi uchun 420 tagacha vizual to'p)
        function syncSimulatedBalls(side, isInitial = false) {
            const MAX_VISUAL_BALLS = state.mode === 'rings' ? 90 : 420;
            const targetVisual = Math.min(side.logicalBalls, MAX_VISUAL_BALLS);

            // Birinchi faol qavatni topish
            const activeFloor = side.floors.find(f => !f.broken);
            const maxSpawnY = activeFloor ? Math.max(side.box.y + 30, activeFloor.y - side.radius - 6) : (side.box.y + 120);

            while (side.balls.length < targetVisual) {
                let spawnX, spawnY, vx, vy;
                if (state.mode === 'rings') {
                    const cx = side.box.x + side.box.w / 2;
                    const cy = side.box.y + side.box.h * 0.36;
                    spawnX = cx + (Math.random() - 0.5) * 18;
                    spawnY = cy + (Math.random() - 0.5) * 18;
                    const ang = Math.random() * Math.PI * 2;
                    const spd = 4.5 + Math.random() * 2.5;
                    vx = Math.cos(ang) * spd;
                    vy = Math.sin(ang) * spd;
                } else {
                    if (!isInitial && side.balls.length > 0) {
                        const refBall = side.balls[Math.floor(Math.random() * side.balls.length)];
                        spawnX = Math.min(side.box.x + side.box.w - side.radius - 4, Math.max(side.box.x + side.radius + 4, refBall.x + (Math.random() - 0.5) * 20));
                        spawnY = Math.min(maxSpawnY, Math.max(side.box.y + side.radius + 4, refBall.y - Math.random() * 25));
                    } else {
                        spawnX = side.box.x + side.radius + 8 + Math.random() * (side.box.w - side.radius * 2 - 16);
                        spawnY = side.box.y + side.radius + 8 + Math.random() * Math.max(15, (maxSpawnY - side.box.y - 24));
                    }
                    vx = (Math.random() - 0.5) * 7;
                    vy = (Math.random() - 0.5) * 5;
                }

                side.balls.push({
                    x: spawnX,
                    y: spawnY,
                    vx: vx,
                    vy: vy,
                    trail: []
                });
            }

            if (side.balls.length > targetVisual) {
                side.balls.length = targetVisual;
            }
        }
